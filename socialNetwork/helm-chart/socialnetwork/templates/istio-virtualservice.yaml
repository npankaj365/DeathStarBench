{{- if .Values.istio.enabled }}
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: {{ .Chart.Name }}-virtualservice
  namespace: {{ .Release.Namespace }}
spec:
  hosts:
  - "*"
  gateways:
  - {{ .Values.istio.gatewayName }}
  http:
  - route:
    - destination:
        host: nginx-thrift
        port:
          number: 8080 # Assuming nginx-thrift service port, verify this
{{- end }}
